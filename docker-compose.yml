services:
  vllm:
    build:
      context: .
      args:
        VLLM_VERSION: ${VLLM_VERSION:-v0.19.1-ubuntu2404}
    image: llm-serve-nvidia:${VLLM_VERSION:-v0.19.1-ubuntu2404}
    container_name: vllm-server
    env_file:
      - config.env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Persist downloaded model weights between restarts
      - hf-cache:/root/.cache/huggingface
    # Required for PyTorch/NCCL shared memory (tensor parallel, dataloaders)
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot downloads ~28 GB of weights — allow plenty of time
      start_period: 45m
    restart: unless-stopped

  # Sends a 1-token request every 90s so the GPU never looks idle to the
  # host's GPU-sharing shim (idle VRAM gets memswap-evicted and the engine
  # wedges on restore). Remove on hosts without the shim.
  keepalive:
    image: curlimages/curl:8.11.1
    container_name: vllm-keepalive
    env_file:
      - config.env
    depends_on:
      vllm:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          curl -s -m 60 "http://vllm:$${PORT:-8000}/v1/completions" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"$${MODEL}\", \"prompt\": \"Hi\", \"max_tokens\": 1}" \
            -o /dev/null
          sleep 90
        done
    restart: unless-stopped

volumes:
  hf-cache:
