services:
  sglang:
    build:
      context: .
      args:
        SGLANG_VERSION: ${SGLANG_VERSION:-latest-cu129-runtime}
    image: llm-serve-nvidia:sglang-${SGLANG_VERSION:-latest-cu129-runtime}
    container_name: sglang-server
    env_file:
      - config.env
    # Host networking: the provider pod's docker bridge has broken DNS
    # (model downloads fail), and this binds PORT directly.
    network_mode: host
    # Required for PyTorch shared memory
    ipc: host
    shm_size: 32g
    volumes:
      # Model weights on the provider's big NFS share (not the root disk)
      - ${HF_CACHE_DIR:-/data/share73/hf-cache}:/root/.cache/huggingface
    # NOTE: intentionally NO GPU reservation block / runtime override.
    # The cloud provider's container runtime injects GPU access + their
    # sharing shim automatically; compose-level GPU requests conflict
    # with that injection (their support guide + LEARNINGS.md).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot downloads weights + captures CUDA graphs
      start_period: 30m
    restart: unless-stopped
