services:
  vllm:
    build:
      context: .
      args:
        VLLM_VERSION: ${VLLM_VERSION:-v0.19.1-ubuntu2404}
    image: llm-serve-nvidia:${VLLM_VERSION:-v0.19.1-ubuntu2404}
    container_name: vllm-server
    env_file:
      - config.env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Persist downloaded model weights between restarts
      - hf-cache:/root/.cache/huggingface
    # Required for PyTorch/NCCL shared memory (tensor parallel, dataloaders)
    ipc: host
    # NOTE: intentionally NO GPU reservation block / runtime override here.
    # The cloud provider's container runtime injects GPU access + their
    # sharing shim into every container automatically, and their support
    # guide says compose-level GPU requests conflict with that injection.
    # On a standard NVIDIA host, restore:
    #   deploy: {resources: {reservations: {devices:
    #     [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot downloads ~28 GB of weights — allow plenty of time
      start_period: 45m
    restart: unless-stopped

volumes:
  hf-cache:
